name: CI

# Valida type-check + build nos PRs para main e no merge em main.
# (Push direto em main é bloqueado por branch protection — o gatilho de push
# cobre apenas o commit de merge.)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs antigos da mesma ref quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (astro check + astro build)
        run: npm run build
